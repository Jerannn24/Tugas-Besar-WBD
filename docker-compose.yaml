services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://${DB_DEV_RUNTIME_USER}:${DB_DEV_RUNTIME_PASSWORD}@postgres:5432/${DB_DEV_PLATFORM_DB}?sslmode=disable"
      DB_RUNTIME: ${DB_DEV_RUNTIME_USER:?Set DB_DEV_RUNTIME_USER in .env}
      DB_RUNTIME_PASSWORD: ${DB_DEV_RUNTIME_PASSWORD:?Set DB_DEV_RUNTIME_PASSWORD in .env}
      DB_PLATFORM: ${DB_DEV_PLATFORM_DB:?Set DB_DEV_PLATFORM_DB in .env}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_DIST: /app/web
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./frontend/dist:/app/web:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: ${DB_DEV_BOOTSTRAP_USER:?Set DB_DEV_BOOTSTRAP_USER in .env}
      POSTGRES_PASSWORD: ${DB_DEV_BOOTSTRAP_PASSWORD:?Set DB_DEV_BOOTSTRAP_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_PLATFORM: ${DB_DEV_PLATFORM_DB:?Set DB_DEV_PLATFORM_DB in .env}
      DB_OWNER: ${DB_DEV_OWNER_USER:?Set DB_DEV_OWNER_USER in .env}
      DB_OWNER_PASSWORD: ${DB_DEV_OWNER_PASSWORD:?Set DB_DEV_OWNER_PASSWORD in .env}
      DB_RUNTIME: ${DB_DEV_RUNTIME_USER:?Set DB_DEV_RUNTIME_USER in .env}
      DB_RUNTIME_PASSWORD: ${DB_DEV_RUNTIME_PASSWORD:?Set DB_DEV_RUNTIME_PASSWORD in .env}
      DB_TARGET_A: ${DB_DEV_TARGET_A:?Set DB_DEV_TARGET_A in .env}
      DB_TARGET_B: ${DB_DEV_TARGET_B:?Set DB_DEV_TARGET_B in .env}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-test:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${DB_TEST_BOOTSTRAP_USER:?Set DB_TEST_BOOTSTRAP_USER in .env}
      POSTGRES_PASSWORD: ${DB_TEST_BOOTSTRAP_PASSWORD:?Set DB_TEST_BOOTSTRAP_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_PLATFORM: ${DB_TEST_PLATFORM_DB:?Set DB_TEST_PLATFORM_DB in .env}
      DB_OWNER: ${DB_TEST_OWNER_USER:?Set DB_TEST_OWNER_USER in .env}
      DB_OWNER_PASSWORD: ${DB_TEST_OWNER_PASSWORD:?Set DB_TEST_OWNER_PASSWORD in .env}
      DB_RUNTIME: ${DB_TEST_RUNTIME_USER:?Set DB_TEST_RUNTIME_USER in .env}
      DB_RUNTIME_PASSWORD: ${DB_TEST_RUNTIME_PASSWORD:?Set DB_TEST_RUNTIME_PASSWORD in .env}
      DB_TARGET_A: ${DB_TEST_TARGET_A:?Set DB_TEST_TARGET_A in .env}
      DB_TARGET_B: ${DB_TEST_TARGET_B:?Set DB_TEST_TARGET_B in .env}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
      
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.0
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    command:
      - "-config.file=/etc/tempo.yaml"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.11.0
    volumes:
      - ./deploy/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    
volumes:
  postgres-dev-data:
  postgres-test-data:

  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data: